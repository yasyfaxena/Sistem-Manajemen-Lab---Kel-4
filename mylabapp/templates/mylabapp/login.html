<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: white;
    }

    .login-container {
      width: 320px;
      height: auto;
      background-color: #bcc1c9;
      border-radius: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      box-sizing: border-box;
    }

    h2 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 30px;
      text-transform: uppercase;
    }

    form {
      width: 100%;
    }

    .input-group {
      width: 100%;
      margin-bottom: 15px;
      position: relative;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 10px 10px 40px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .icon-user,
    .icon-lock {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: #666;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #4a5568;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }

    button:hover {
      background-color: #2d3748;
    }

    .error-message {
      color: #dc2626;
      background-color: #fee2e2;
      border: 1px solid #fecaca;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    {% if messages %}
      {% for message in messages %}
        <div class="error-message">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="input-group">
        <svg class="icon-user" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <input type="text" name="username" placeholder="username" required>
      </div>
      
      <div class="input-group">
        <svg class="icon-lock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <input type="password" name="password" placeholder="Password" required>
      </div>
      
      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
